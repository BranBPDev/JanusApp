name: Build and Release JanusApp

# Orquestador: se activa al subir cambios a main y reparte el trabajo entre los workflows reutilizables (ci-*.yml).
# Lo que no depende de nada corre a la vez; lo que necesita el resultado de otro espera con «needs».
#
#   config ───────────────┐
#                          ├─► empaquetar ─► publicar
#   dependencias ─► compilar ┘
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'testing/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  # ---- en paralelo: no dependen entre sí ----
  config:
    name: Configuración del release
    uses: ./.github/workflows/ci-config.yml
    permissions:
      contents: read

  dependencias:
    name: Python y dependencias
    uses: ./.github/workflows/ci-dependencias.yml
    permissions:
      contents: read

  # ---- esperan a lo anterior ----
  compilar:
    name: Compilar EXE
    needs: dependencias
    uses: ./.github/workflows/ci-compilar.yml
    permissions:
      contents: read

  empaquetar:
    name: Preparar ZIP
    needs: [config, compilar]
    uses: ./.github/workflows/ci-empaquetar.yml
    permissions:
      contents: read

  publicar:
    name: Publicar release
    needs: [config, empaquetar]
    uses: ./.github/workflows/ci-publicar.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.config.outputs.tag }}
      name: ${{ needs.config.outputs.name }}
      description: ${{ needs.config.outputs.description }}
      prerelease: ${{ needs.config.outputs.prerelease == 'true' }}
      make_latest: ${{ needs.config.outputs.make_latest == 'true' }}

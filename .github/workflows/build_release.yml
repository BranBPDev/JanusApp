name: Build Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
env:
  MODEL_URL: https://huggingface.co/bartowski/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/Qwen2.5-Coder-1.5B-Instruct-Q8_0.gguf
  MODEL_FILE: Qwen2.5-Coder-1.5B-Instruct-Q8_0.gguf
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller JanusApp.spec
      - name: Zip ligero
        shell: pwsh
        run: Compress-Archive -Path dist/JanusApp/* -DestinationPath JanusApp.zip -CompressionLevel NoCompression
      - name: Cache modelo
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_FILE }}
          key: model-${{ env.MODEL_FILE }}
      - name: Descargar modelo
        shell: pwsh
        run: |
          if (-not (Test-Path $env:MODEL_FILE)) { curl.exe -L --fail --retry 5 -o $env:MODEL_FILE $env:MODEL_URL }
          $b = [System.IO.File]::ReadAllBytes($env:MODEL_FILE)[0..3]
          if ([System.Text.Encoding]::ASCII.GetString($b) -ne "GGUF") { throw "Modelo no es GGUF" }
      - name: Zip completo (con modelo)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/JanusApp/app/models/ia | Out-Null
          Copy-Item $env:MODEL_FILE dist/JanusApp/app/models/ia/
          7z a -tzip -mx=0 JanusApp-Completo.zip ./dist/JanusApp/*
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            JanusApp.zip
            JanusApp-Completo.zip
            version.json
